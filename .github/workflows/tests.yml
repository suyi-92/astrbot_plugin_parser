name: Local regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        bilibili: ["17.4.1", "17.4.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Ensure FFmpeg and ffprobe
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - run: python -m pip install -r requirements.txt -r requirements-test.txt "bilibili-api-python==${{ matrix.bilibili }}"
      - run: python -m pytest -q
      - run: python -m compileall -q main.py core tests
      - run: ruff check --select F,E9 main.py core/diagnostics.py core/resumable.py core/download.py core/utils.py core/config.py core/clean.py core/sender.py core/parsers/bilibili tests
